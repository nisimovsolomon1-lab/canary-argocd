{{- range $track, $version := .Values.versions }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-{{ $track }}
spec:
  replicas: {{ index $.Values.replicas $track }}
  selector:
    matchLabels:
      app: canary-web
      track: {{ $track }}
  template:
    metadata:
      labels:
        app: canary-web
        track: {{ $track }}
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '<p>%s | %s | %s</p>\n' \
              '{{ $.Values.environment }}' '{{ $track }}' \
              '{{ $version }}' > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: {path: /, port: 80}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
{{- end }}
